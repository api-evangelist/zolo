      Primary evidence for the access gate. Section 23 Virtual Office Website; verbatim
      prohibition on scraping, screen scraping, database scraping and data mining;
      board proprietary-rights acknowledgements for CREA, TRREB, ITSO, REBGV, Pillar9
      and OREB. Retrieved via Internet Archive because the live URL is Cloudflare-challenged.
  - url: https://www.zolo.ca/legal
