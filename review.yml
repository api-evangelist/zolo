actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirectoryCreated: false
  reason: >-
    apis[] is deliberately empty. Zolo documents no public API. Listing the
    robots-disallowed /gallery_map_json.php route or the undocumented
    rss_new_listings.php syndication feed would misrepresent private implementation
    details and an SEO aid as developer products, and the Terms of Use expressly forbid
    programmatic collection of the data behind them. No specification of any kind —
    OpenAPI, Swagger, OData $metadata, AsyncAPI, GraphQL SDL or Postman collection —
    was found, so no openapi/ directory was created.
