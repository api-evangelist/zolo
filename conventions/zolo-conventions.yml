  well_known: well-known/zolo-well-known.yml
  conformance: conformance/zolo-conformance.yml
  json_ld: json-ld/zolo-json-ld.yml
  json_schema: json-schema/zolo-map-listing.schema.json
  packages: packages/zolo-packages.yml
