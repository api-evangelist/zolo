description: >-
  Zolo is one of Canada's largest national residential real estate marketplaces and a licensed
  brokerage, operating as Zolo Ventures Ltd. with provincial brokerage subsidiaries — Zolo Realty
  (Ontario), (Alberta), (British Columbia), (Saskatchewan), (Manitoba) and (Quebec) Inc. — plus
  Zolo Mortgages Ltd. and Zolo Mortgages (Alberta) Ltd., all owned by Questrade Financial Group
  Inc. Founded in 2012 as a digital-first brokerage and headquartered at 1900-5700 Yonge Street in
  Toronto, Zolo reports over 10 million monthly visitors, 750+ active REALTORS®, and $1.5B+ in
  annual transaction volume across British Columbia, Alberta, Saskatchewan and Ontario. It sits in
  the Canadian challenger layer alongside HouseSigma, Wahi and Properly, below CREA — the single
  national cooperative that operates REALTOR.ca and the Data Distribution Facility (DDF) that
  syndicates member boards' listings — competing on listing speed, sold-price visibility and
  home-value tooling over data the boards and CREA control. Its API posture is closed. There is no
  developer portal, no API program page, no partner or data-licensing page, and no machine-readable
  API contract of any kind — no OpenAPI, GraphQL, AsyncAPI or MCP surface. The subdomains api.,
  developer., developers., docs., data. and partners.zolo.ca do not resolve in DNS and have never
  appeared in Certificate Transparency, and every conventional contract path on www.zolo.ca is
  answered by a Cloudflare bot challenge (HTTP 403, cf-mitigated: challenge) rather than a
  specification. What Zolo does publish is syndication, not integration: an unauthenticated RSS 2.0
  new-listings feed at /rss_new_listings.php, a family of sitemaps.org XML documents, and a
  site-wide schema.org JSON-LD block carrying organization identity only. Behind the edge it
  operates an undocumented JSON endpoint at /gallery_map_json.php and two first-party mobile apps
  (com.ols.zolo) on a private backend. Zolo's own robots.txt declares that RSS feed as a sitemap
  and a CREA terms-acceptance route at /crea_accept.php, and Section 23 of
  its Terms of Use is a Virtual Office Website (VOW) clause requiring registration, a bona fide
  interest in buying or selling, personal non-commercial use only, and an express prohibition on
  "scraping" (including "screen scraping" and "database scraping"), data mining, redistribution or
  sublicensing — enforceable directly by CREA, TRREB, ITSO, REBGV, Pillar9 and OREB. Access is
  licensed, not open. RESO is absent: Zolo is not among the nineteen Canadian organizations RESO
  lists as members, and no Web API or Data Dictionary certification, OData $metadata document, or
  Universal Property Identifier (UPI) usage was found. No open, unlicensed dataset is published.
